workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == 'schedule'
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
stages:
- renovate
- gate
- build

# Everything the image build consumes — keep in sync with the build job's
# changes filter. The build-gate hashes these paths (plus .gitlab-ci.yml,
# which carries the build contract) as tree/blob git ids: pure content
# addresses, so docs commits, CI-only commits and rebases that preserve
# content hash identically and skip the rebuild.
.build-inputs: &build-inputs "VERSION .buildkite/check-wheel-size.py CMakeLists.txt benchmarks build_rust.sh cmake csrc docker examples pyproject.toml requirements rust-toolchain.toml rust setup.py tools use_existing_torch.py vllm"

renovate:
  stage: renovate
  image: ${CI_REGISTRY}/infra/renovate:latest
  variables:
    RENOVATE_TOKEN: ${BUILD_TOKEN}
    RENOVATE_PLATFORM_COMMIT: "true"
    RENOVATE_CONFIG_VALIDATION_ERROR: "true"
    RENOVATE_THROW_ERRORS: "true"
    LOG_LEVEL: "debug"
  script:
  - renovate ${CI_PROJECT_PATH}
  rules:
  - if: $CI_PIPELINE_SOURCE == 'schedule'
build-gate:
  stage: gate
  image: ${CI_REGISTRY}/infra/docker:latest
  variables:
    BUILD_INPUTS: *build-inputs
    GIT_DEPTH: "1"
  script:
  - |
    # Content hash of the build inputs at a commit: tree/blob git ids per
    # path (with a marker for paths absent at that commit), so the hash
    # depends on content alone — not on commit SHAs or dates.
    input_hash() {
      for p in $BUILD_INPUTS .gitlab-ci.yml; do
        git rev-parse -q --verify "$1:$p" 2>/dev/null || echo absent
      done | sha256sum | cut -d' ' -f1
    }
    cur=$(input_hash HEAD)
    decision="build"
    if [ "${FORCE_BUILD:-0}" = "1" ]; then
      decision="build: FORCE_BUILD=1"
    else
      # Newest successful pipeline on this branch that actually ran a build
      # job: its commit holds the sources the registry tag was built from.
      # (Pipeline list rows are flat objects; split on '{' to walk them.)
      for row in $(wget -qO- --header "PRIVATE-TOKEN: ${BUILD_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines?ref=${CI_COMMIT_REF_NAME}&status=success&per_page=10" \
          | tr '{' '\n' | grep '"status":"success"'); do
        pid=$(printf '%s' "$row" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
        psha=$(printf '%s' "$row" | grep -o '"sha":"[0-9a-f]*"' | cut -d'"' -f4)
        if wget -qO- --header "PRIVATE-TOKEN: ${BUILD_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${pid}/jobs?per_page=100" \
            | grep -q '"name":"build"'; then
          last_sha="$psha"
          break
        fi
      done
      if [ -z "${last_sha:-}" ]; then
        echo "warn: no previous successful build found; building"
      elif [ "$last_sha" = "$CI_COMMIT_SHA" ]; then
        decision="skip: this commit's build inputs were already built ($last_sha)"
      elif git fetch -q --depth=1 origin "$last_sha" 2>/dev/null; then
        if [ "$cur" = "$(input_hash "$last_sha")" ]; then
          decision="skip: build inputs unchanged since $last_sha"
        fi
      else
        echo "warn: could not fetch last-built commit $last_sha; building"
      fi
    fi
    echo "$decision" | tee build-decision.txt
  artifacts:
    paths:
    - build-decision.txt
    expire_in: 1 day
  rules:
  - if: $CI_PIPELINE_SOURCE == 'schedule'
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  image: moby/buildkit:rootless
  needs:
  - job: build-gate
    artifacts: true
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    CACHE_REF: registry.ocnr.org/infra/container-cache:vllm-${CI_COMMIT_BRANCH}
    DOCKER_CONFIG: /tmp/.docker
    # Everything the image build consumes — keep in sync with the changes
    # filter below; this drives the SOURCE_DATE_EPOCH pathspec.
    BUILD_INPUTS: *build-inputs
  timeout: 6 hours
  before_script:
  - |
    mkdir -p /tmp/.docker
    echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n "build-token:${BUILD_TOKEN}" | base64 -w0)\"}}}" > /tmp/.docker/config.json
    # The buildkit rootless image runs as uid 1000 while the runner checked
    # the repo out as another uid, so git refuses every repo operation
    # ("dubious ownership") and $(git ...) silently comes back empty — that
    # is how an empty SOURCE_DATE_EPOCH crashed wheel packaging 24 minutes
    # into pipeline 56260. Exempt the checkout, then fail fast if the epoch
    # is still missing.
    export GIT_CONFIG_GLOBAL=/tmp/gitconfig
    git config --global --add safe.directory "$CI_PROJECT_DIR"
    # VERSION carries the build flavor (e.g. 0.30.0+sm120.cu130): '+' becomes
    # '-' so the tag stays docker-valid, '.cu' becomes '-cu' in the suffix.
    export CONTAINER_TAG=$(cat VERSION | sed 's/^v//; s/^.*://; s/+/-/; s/\.cu/-cu/')
    export CACHE_REF="registry.ocnr.org/infra/container-cache:vllm-${CI_COMMIT_BRANCH}"
    # Deterministic build metadata: the epoch fixes buildkit's image config
    # created/history stamps and setuptools' wheel archive timestamps, so a
    # rebuild of identical sources converges on the same digest and the
    # registry push becomes a no-op. Key it to the AUTHOR date of the last
    # commit that touched the build inputs, not HEAD's committer date: docs
    # and CI-only commits and rebases preserve author dates, so unchanged
    # sources rebuild byte-identically instead of churning the digest. A
    # shallow clone may not reach that commit — fall back to HEAD's
    # committer date.
    export SOURCE_DATE_EPOCH=$(git log -1 --format=%at -- $BUILD_INPUTS 2>/dev/null || true)
    if [ -z "$SOURCE_DATE_EPOCH" ]; then
      export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct 2>/dev/null || true)
    fi
    if [ -z "$SOURCE_DATE_EPOCH" ]; then
      echo "FATAL: could not determine SOURCE_DATE_EPOCH; refusing to build a non-reproducible image" >&2
      exit 1
    fi
    echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
  script:
  - |
    decision=$(cat build-decision.txt 2>/dev/null || echo build)
    case "$decision" in
      build*) ;;
      *)
        echo "build-gate: $decision — nothing to do"
        exit 0
        ;;
    esac
    # Builds only ever run at the branch tip (a push, or an api trigger at
    # the tip); anything else is a retried pipeline for an older tree, and
    # rebuilding it would push stale content over the mutable branch tags.
    tip=$(git ls-remote origin "refs/heads/${CI_COMMIT_BRANCH}" 2>/dev/null | cut -f1 || true)
    if [ -n "$tip" ] && [ "$tip" != "$CI_COMMIT_SHA" ]; then
      echo "Skipping build: $CI_COMMIT_SHA is not ${CI_COMMIT_BRANCH}'s tip ($tip); a stale tree must not overwrite ${CI_REGISTRY_IMAGE}:${CI_COMMIT_BRANCH}"
      exit 0
    fi
    buildctl-daemonless.sh build \
      --frontend dockerfile.v0 \
      --local context=$CI_PROJECT_DIR \
      --local dockerfile=$CI_PROJECT_DIR/docker \
      --opt build-arg:SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} \
      --output type=image,name=${CI_REGISTRY_IMAGE}:${CONTAINER_TAG},push=true \
      --output type=image,name=${CI_REGISTRY_IMAGE}:${CI_COMMIT_BRANCH},push=true \
      --export-cache type=registry,ref=${CACHE_REF},mode=max \
      --import-cache type=registry,ref=${CACHE_REF}
  rules:
  - if: $CI_PIPELINE_SOURCE == 'schedule'
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    changes: ["VERSION", ".buildkite/check-wheel-size.py", "CMakeLists.txt", "benchmarks/**/*", "build_rust.sh", "cmake/**/*", "csrc/**/*", "docker/**/*", "examples/**/*", "pyproject.toml", "requirements/**/*", "rust-toolchain.toml", "rust/**/*", "setup.py", "tools/**/*", "use_existing_torch.py", "vllm/**/*"]
